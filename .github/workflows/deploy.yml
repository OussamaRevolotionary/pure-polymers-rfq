name: Deploy quote portal to GitHub Pages

# The portal is a static Vite build. .env.production sets VITE_BASE to the repo
# sub-path, so the bundle is published at
# https://oussamarevolotionary.github.io/pure-polymers-rfq/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a run still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quote-portal/package-lock.json

      - name: Install
        run: npm ci
        working-directory: quote-portal

      - name: Verify the n8n Code nodes still pass
        run: node n8n/test/run-code-nodes.mjs

      - name: Build
        run: npm run build
        working-directory: quote-portal

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quote-portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
